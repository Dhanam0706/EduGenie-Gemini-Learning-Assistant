<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie - Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>EduGenie</h1>
    <p class="subtitle">Google Gemini Powered Learning Assistant</p>

    <form id="edugenie-form">
      <label for="task">What would you like to do?</label>
      <select id="task" name="task">
        <option value="explain">Explain a concept</option>
        <option value="qa">Ask a question</option>
        <option value="quiz">Generate a quiz</option>
        <option value="summarize">Summarize text</option>
        <option value="recommend">Recommend a learning path</option>
      </select>

      <label for="user-input">Your topic, question or study material</label>
      <textarea id="user-input" name="user-input" rows="7"
        placeholder="Example: Explain binary search with an example."></textarea>

      <div id="followup-row" class="followup" hidden>
        <input type="checkbox" id="followup">
        <label for="followup">This is a follow-up to the previous answer</label>
      </div>

      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <section id="status" class="status" aria-live="polite"></section>
    <section id="result" class="result" hidden></section>
  </main>

  <script>
    const ENDPOINTS = {
      explain: "/explain",
      qa: "/qa",
      quiz: "/quiz",
      summarize: "/summarize",
      recommend: "/learn/recommendations",
    };

    const form = document.getElementById("edugenie-form");
    const taskSelect = document.getElementById("task");
    const inputBox = document.getElementById("user-input");
    const followupRow = document.getElementById("followup-row");
    const followupBox = document.getElementById("followup");
    const submitBtn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    let lastQuestion = "";
    let lastAnswer = "";

    // The follow-up option is only shown for "Ask a question".
    taskSelect.addEventListener("change", () => {
      followupRow.hidden = taskSelect.value !== "qa" || !lastAnswer;
    });

    function showError(message) {
      statusBox.textContent = message;
      statusBox.className = "status error";
      resultBox.hidden = true;
    }

    function showText(text) {
      resultBox.className = "result";
      resultBox.textContent = text;
      resultBox.hidden = false;
    }

    function showQuiz(questions) {
      resultBox.className = "result";
      resultBox.textContent = "";
      questions.forEach((q, qi) => {
        const card = document.createElement("div");
        card.className = "quiz-card";

        const title = document.createElement("p");
        title.className = "quiz-question";
        title.textContent = (qi + 1) + ". " + q.question;
        card.appendChild(title);

        const feedback = document.createElement("p");
        feedback.className = "quiz-feedback";

        const letters = ["A", "B", "C", "D"];
        q.options.forEach((option, oi) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "quiz-option";
          btn.textContent = letters[oi] + ". " + option;
          btn.addEventListener("click", () => {
            card.querySelectorAll(".quiz-option").forEach(b => (b.disabled = true));
            if (oi === q.answer_index) {
              btn.classList.add("correct");
              feedback.textContent = "Correct!";
            } else {
              btn.classList.add("wrong");
              card.querySelectorAll(".quiz-option")[q.answer_index].classList.add("correct");
              feedback.textContent = "Not quite. The correct answer is " +
                letters[q.answer_index] + ". " + q.options[q.answer_index];
            }
          });
          card.appendChild(btn);
        });

        card.appendChild(feedback);
        resultBox.appendChild(card);
      });
      resultBox.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const task = taskSelect.value;
      const text = inputBox.value.trim();

      if (!text) {
        showError("Please enter a question or topic first.");
        return;
      }

      const payload = { text: text, context: "" };
      if (task === "qa" && followupBox.checked && lastAnswer) {
        payload.context = "Student asked: " + lastQuestion + "\nEduGenie answered: " + lastAnswer;
      }

      submitBtn.disabled = true;
      statusBox.textContent = "EduGenie is thinking...";
      statusBox.className = "status";
      resultBox.hidden = true;

      try {
        const response = await fetch(ENDPOINTS[task], {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          showError(data.detail || "Something went wrong. Please try again.");
          return;
        }

        statusBox.textContent = "";
        if (task === "quiz") {
          showQuiz(data.questions);
        } else {
          showText(data.result);
        }

        if (task === "qa") {
          lastQuestion = text;
          lastAnswer = data.result;
          followupRow.hidden = false;
          followupBox.checked = false;
        }
      } catch (error) {
        showError("Could not reach the EduGenie server. Is it running?");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
